<!doctype html>
<!-- Magpie plugin sandbox page (design.md §6): sandbox="allow-scripts", no
     fetch/network. It only guides: discover service URL via the bridge when
     available, else jump to the fixed fallback port, else show instructions. -->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提示词优化统计</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center;
      font: 13px/1.6 "Aptos", "Segoe UI Variable", "Noto Sans SC", "PingFang SC", sans-serif;
      color: var(--magpie-fg, CanvasText); background: var(--magpie-bg, Canvas);
    }
    .waiting { display: grid; gap: 6px; max-width: 460px; padding: 0 20px; text-align: center; color: var(--magpie-muted, GrayText); }
    .waiting b { color: var(--magpie-fg, CanvasText); font-size: 14px; }
  </style>
</head>
<body>
  <div class="waiting">
    <b>提示词优化统计</b>
    <div id="said">正在连接本地统计服务…</div>
  </div>
  <script>
    (() => {
      const FALLBACK_PORT = 3497;
      const said = document.getElementById("said");
      // If the navigation target exists the frame is replaced and this timer
      // never fires — it is purely the "service not running" hint.
      const timer = setTimeout(() => {
        said.textContent = "统计服务未启动：请在插件 options 设 port，或在插件目录运行 node serve.mjs。";
      }, 2500);
      (async () => {
        let port = FALLBACK_PORT;
        let service = "";
        try {
          await window.magpie?.ready; // bridge optional — page degrades without it
          const opts = await window.magpie?.options?.get?.();
          const v = Number(opts?.port);
          if (Number.isInteger(v) && v > 0 && v < 65536) port = v;
          const s = window.magpie?.service;
          if (typeof s === "string" && /^https?:\/\//.test(s)) service = s;
        } catch { /* stay on defaults */ }
        location.replace(service || `http://127.0.0.1:${port}/`);
        clearTimeout(timer);
      })();
    })();
  </script>
</body>
</html>
