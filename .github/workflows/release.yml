name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip real npm publish)'
        required: false
        default: 'true'

permissions:
  contents: write   # create GitHub Release
  id-token: write   # npm OIDC trusted publishing（配好后无需 NPM_TOKEN）

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install || true
      - run: bun test || node --test test/*.test.mjs
      # 零依赖仓库：node --test 是主路径，bun test 兜底（可选，失败不阻断则改 continue-on-error）

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm     # 建议配 GitHub Environment "npm" 做发布保护
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
